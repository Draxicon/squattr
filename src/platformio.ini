; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; meant for those with the WROOM board and the new tft screens
; you can upload to the board by running:  pio run -e esp32WROOM-tft -t upload
[env:esp32WROOM-tft]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = bodmer/TFT_eSPI@^2.4.31

build_flags =
    -Os  
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=19
    -D TFT_RST=4
    -D TFT_BL=21
    -D LOAD_GLCD=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READFREQUENCY=20000000
    

; meant for those with the WROOM board and the old oled screens
; you can upload to the board by running:  pio run -e esp32WROOM-Oled -t upload
;[env:esp32WROOM-Oled]
;platform = espressif32
;board = esp32dev
;framework = arduino

; meant for those with the s3 board and the new tft screens
; you can upload to the board by running:  pio run -e esp32-s3-tft -t upload
[env:esp32-s3-tft]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8
framework = arduino
lib_deps = bodmer/TFT_eSPI@^2.4.31

build_flags =
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D TFT_MISO=37
    -D TFT_SCLK=36
    -D TFT_CS=39
    -D TFT_DC=21
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=27000000
    -D SPI_READFREQUENCY=20000000
     
; meant for those with the s3 board and the new tft screens
; you can upload to the board by running:  pio run -e esp32-s3-Oled -t upload
;[env:esp32-s3-Oled]
;platform = espressif32
;board = esp32-s3-devkitc-1-n16r8
;framework = arduino

